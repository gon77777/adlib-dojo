<style>

.dot.ct circle{stroke:#fff;stroke-width:3.5} .dot.lit circle{stroke:#ffd54a;stroke-width:4}
.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px 22px;padding:12px 16px;overflow:auto;align-content:start}

#chips span.on{background:var(--root);color:#241503;border-color:var(--root);font-weight:700}
.kb{margin:0}
#task{flex:2;min-width:300px} #task .tt{font-size:16px;margin:2px 0} #task .sub{color:var(--sub);font-size:12px}
#task .tb{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}

.rc{padding:12px 16px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px 24px;align-content:start}
.rc h3{margin:0 0 6px;font-size:14px;color:var(--sub);font-weight:600} .rc .big{font-size:22px;font-weight:700}
.stats{display:flex;gap:22px;grid-column:1/-1} .stats div span{display:block;color:var(--sub);font-size:12px}

.rc button{min-height:40px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit}
.rc textarea{width:100%;height:70px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;font:12px monospace}
.rc .wk{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.bkw{flex:1;min-height:0;display:flex} .bkl{width:250px;overflow:auto;border-right:1px solid var(--line);padding:8px 0}
.bkl h4{margin:10px 14px 2px;color:var(--sub);font-size:12px;font-weight:600} .bkl button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);font:inherit;padding:9px 16px;min-height:44px}
.bkl button[aria-current=true]{background:var(--panel);box-shadow:inset 3px 0 var(--root)} .bkl small{color:var(--sub);margin-left:6px}
.bkd{flex:1;overflow:auto;padding:14px 22px;max-width:760px} .bkd h2{margin:0 0 2px;font-size:20px} .bkd .y{color:var(--sub);margin-bottom:10px}
.bkd h5{margin:14px 0 2px;color:var(--root);font-size:12px;letter-spacing:.04em} .bkd p{margin:0 0 6px}
#task a{color:var(--root);text-decoration:underline;cursor:pointer}
.th{flex:1;overflow:auto;padding:12px 18px} .th .tg{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.th .tg button{min-width:50px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--sub);font:inherit}
.th .tg button[aria-pressed=true]{background:var(--root);color:#241503;border-color:var(--root);font-weight:700}
.th ul{margin:4px 0 10px;padding-left:20px} .th li{margin:2px 0} .th h3{margin:14px 0 2px;font-size:14px;color:var(--root)} .th .cd{max-width:780px}
.th button.go,.th table button{min-height:40px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit}
.th table{border-collapse:collapse;max-width:780px;width:100%} .th td,.th th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.wk{fill:#ece6d6;stroke:#6b645a} .bk{fill:#1a1c1f;stroke:#000} .key{cursor:pointer}
.fq .big{font-size:22px;font-weight:700;margin:6px 0} .fq .fb{min-height:28px;font-weight:700} .fq .fb.ok{color:var(--char)} .fq .fb.ng{color:#e0726c}
.dot.q circle{fill:#fff} .dot.bad circle{fill:#d9534f} .dot.sol circle{fill:var(--root)} .dot.dim circle{fill:var(--dot);opacity:.35}
.fq .go{margin:4px 6px 4px 0} .fq .row2{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:6px 0} .fq small{color:var(--sub)}

.dot.cur circle{fill:var(--root);stroke:#fff;stroke-width:3.5;opacity:1} .dot.nxt circle{fill:var(--char);opacity:.9} #dr .row2 input[type=range]{min-height:40px;accent-color:var(--root)}
#fstage{min-height:40px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit}
#gear{background:none;border:0;color:var(--sub);font-size:22px;min-width:44px;min-height:44px}
.ph{flex:1;overflow:auto;padding-bottom:16px} .ph .row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 12px} .ph small{color:var(--sub)} .ph .hsec{margin:4px 12px}
.ph .go,.ph .gc,.ph .lk{min-height:40px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit;padding:0 12px}
#h-fret{display:flex;align-items:center;padding:0 6px;max-height:42vh} #h-fret svg{width:100%;max-height:42vh;touch-action:none;user-select:none;-webkit-user-select:none}
.dot.gt3 circle{fill:#ff7a90;stroke:#fff;stroke-width:3} .dot.gt7 circle{fill:var(--char);stroke:#fff;stroke-width:3} .dot.gtn circle{fill:#000a;stroke:#fff;stroke-width:2;stroke-dasharray:3 3} .dot.gtn text{fill:#fff}
.wzs{margin:6px 12px;padding:4px 8px;border:1px solid var(--line);border-radius:10px} .wzs.on{border-color:var(--root)} .wzs .lks,.wzs .row2{margin-left:0;margin-right:0} .wzs>button{border:0;background:none}
.dot.ph circle{fill:#7aa2ff;stroke:#fff;stroke-width:2} .dot.ph text{fill:#08122b} .dot.ph.cur circle{fill:var(--root);stroke-width:4}
#h-grid{margin:4px 12px;display:flex;flex-direction:column;gap:4px} .gr2{display:flex;gap:2px;align-items:center} .gr2 i{width:18px;color:var(--sub);font-style:normal;font-size:12px}

.ph .gc.cu{outline:2px solid var(--root)} .ph .gc.pl{border-color:var(--root);box-shadow:0 0 0 2px var(--root) inset}
.ph .hpanel{margin:6px 0} .lks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 12px} .lk small{margin-left:6px} .lk[aria-pressed=true]{border-color:var(--root);background:#3a2f1a}

/* ===== V24 Android縦画面向けUI ===== */

#play{min-width:48px;min-height:48px;border-radius:24px;font-size:20px} #gear{min-width:48px;min-height:48px;font-size:24px}
#tabs{position:relative;background:var(--panel);border-top:1px solid var(--line);padding-bottom:2px}

select{font-size:16px;min-height:48px;border-radius:10px;padding:6px 10px;width:100%}

.fq .big{font-size:22px} .th .cd{max-width:none} .th .cd select{width:100%}

.rc .wk{min-height:44px} .rc svg{max-width:100%;height:auto}
dialog{padding:18px} dialog button{min-height:48px;width:100%;margin-top:8px}

.fq .row2>.seg{display:flex;flex-direction:row}
.rc table{display:table;white-space:normal;font-size:14px}.rc td,.rc th{padding:8px 4px}.rc td:first-child,.rc th:first-child{width:34%}

.ph .wzs{padding:8px}.ph .wzs>button{width:100%;text-align:left;min-height:48px;font-size:16px;margin:0}
.pbtop{display:flex;align-items:center;gap:12px} #pb-play{flex:1;min-height:56px;border:0;border-radius:14px;background:var(--root);color:#241503;font:inherit;font-size:18px;font-weight:700} #pb-cur{font-size:22px;min-width:96px;text-align:center;color:var(--root)}
#pchips{display:flex;flex-wrap:wrap;gap:6px} #pchips span{min-width:58px;text-align:center;padding:10px 8px;border:1px solid var(--line);border-radius:8px;background:var(--ink)} #pchips span.on{background:var(--root);color:#241503;border-color:var(--root);font-weight:700}
#pb .row{display:flex;gap:10px;align-items:center;color:var(--text)} #pb input[type=range]{flex:1;min-height:48px;accent-color:var(--root)} #pb .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} #pb select{padding:6px 4px;font-size:14px}

<body>
<div id="app">
  <header id="top"><b id="ttl">練習</b><span class="tr"><b id="cur">—</b><button id="play" aria-label="再生">▶</button><button id="gear" aria-label="設定">⚙</button></span></header>
  <main id="pg-p"><div class="pscroll">
    <div class="stick"><div id="fret"></div><div class="zm"><button data-z="out" aria-label="縮小">－</button><button data-z="fit" aria-label="全体">全</button><button data-z="in" aria-label="拡大">＋</button></div>
      <div class="posrow"><span class="lb">ポジション</span><span class="seg" id="pos"></span></div></div>
    <div class="grid2">
      <label>楽器<select id="inst"></select></label>
      <label>キー<select id="key"></select></label>
      <label class="full">スケール<select id="scale"></select></label>
    </div>
    <details class="card" id="pb" open><summary>バッキング(ドラム・ベース・コード)</summary><div class="optb">
      <div class="pbtop"><button id="pb-play">▶ 再生</button><b id="pb-cur">—</b></div>
      <div id="pchips"></div>
      <label>進行<select id="pb-prog"></select></label>
      <label>BPM<span class="row"><input type="range" id="pb-bpm" min="40" max="200"><b id="pb-bpmv"></b></span></label>
      <label>伴奏の音量<span class="row"><input type="range" id="pb-vol" min="0" max="100"></span></label>
      <div class="grid3"><label>ドラム<select id="pb-drum"></select></label><label>ベース<select id="pb-bass"></select></label><label>コード<select id="pb-comp"></select></label></div>
      <label class="chk"><input type="checkbox" id="pb-asc"> コードごとにスケールを自動で切り替える</label>
    </div></details>
    <div id="task" class="card"></div>
    <div class="card tipc"><div class="tip" id="tip"></div>
      <div class="lg"><span><i style="background:var(--root)"></i>ルート</span><span><i style="background:var(--char)"></i>特徴音</span><span><i style="background:var(--dot)"></i>スケール音</span></div></div>
    <details class="card" id="opt"><summary>表示・練習の設定</summary><div class="optb">
      <label>表示<span class="seg" id="mode"><button data-m="note">音名</button><button data-m="deg">度数</button><button data-m="none">なし</button></span></label>
      <label>範囲(フレット)<span class="seg" id="view"></span></label>
      <label>レベル<span class="seg" id="lv"></span></label>
      <label>足場外し<span class="seg" id="fade"><button data-v="0">オフ</button><button data-v="1">オン</button></span><button id="fstage" hidden></button></label>
      <label>1本だけ<select id="only"></select></label>
      <label class="chk"><input type="checkbox" id="left"> 左利き</label>
    </div></details>
  </div></main>
  <main id="pg-h" hidden><div class="ph" id="ph"></div></main>
  <main id="pg-b" hidden><div class="bk">
    <label>進行(キー=練習タブで選んだキー)<select id="bprog"></select></label>
    <div id="chips"></div>
    <label>BPM<span class="row"><input type="range" id="bpm" min="40" max="200"><b id="bpmv"></b><button id="tap">タップ</button></span></label>
    <label><span class="row"><input type="checkbox" id="asc"> コードごとにスケールを自動で切り替える(練習タブの指板が、いまのコードのスケールに追従。停止中は下のコードをタップ)</span></label>
    <details class="card" id="bk-r"><summary>リズム・伴奏の設定</summary><div class="optb">
    <label>スウィング(0=ストレート 100=3連のハネ)<span class="row"><input type="range" id="swing" min="0" max="100" step="5"><b id="swv"></b>
      <span class="seg" id="swm"><button data-v="8">8分</button><button data-v="16">16分</button></span></span></label>
    <label>カウントイン<select id="count"><option value="0">なし</option><option value="1">1小節</option><option value="2">2小節</option></select></label>
    <label>キーシャッフル(進行を何周ごとに別のキーへ)<select id="shuf"><option value="0">オフ</option><option value="1">毎周</option><option value="2">2周ごと</option><option value="4">4周ごと</option></select></label>
    <label>足場外しの間隔(何周ごとに表示を減らす)<select id="fev"><option value="1">毎周</option><option value="2">2周ごと</option><option value="4">4周ごと</option></select></label>
    <label>ドラム<select id="drum"></select></label>
    <label>ベース<select id="bass"></select></label>
    <label>コード<select id="comp"></select></label>
    </div></details>
    <details class="card" id="bk-v"><summary>音量</summary><div class="optb">
    <label>音量 伴奏全体(ドラム・ベース・コードをまとめて)<span class="row"><input type="range" id="v-band" min="0" max="100"></span></label>
    <label>音量 フレーズ(フレーズタブで鳴らす音)<span class="row"><input type="range" id="v-phrase" min="0" max="100"></span></label>
    <label>音量 ドラム<span class="row"><input type="range" id="v-drum" min="0" max="100"></span></label>
    <label>音量 ベース<span class="row"><input type="range" id="v-bass" min="0" max="100"></span></label>
    <label>音量 コード<span class="row"><input type="range" id="v-chord" min="0" max="100"></span></label>
    </div></details>
    <details id="pe"><summary>自作進行エディタ</summary><div id="pe-body"></div></details>
  </div></main>
  <main id="pg-k" hidden><div class="bkw"><div class="bkl" id="bkl"></div><div class="bkd" id="bkd"></div></div></main>
  <main id="pg-d" hidden><div class="th fq" id="dr"></div></main>
  <main id="pg-f" hidden><div class="th fq" id="fq"></div></main>
  <main id="pg-l" hidden><div class="rc" id="rc"></div></main>
  <main id="pg-r" hidden><div class="th" id="th"></div></main>
  <main id="pg-x" hidden><div class="soon" id="soon"></div></main>
  <div id="tabs" role="tablist">
    <div id="more" hidden><button data-t="f">指板</button><button data-t="k">教本</button><button data-t="r">理論</button><button data-t="l">記録</button></div>
    <nav><button role="tab" data-t="p" aria-selected="true">練習</button><button role="tab" data-t="h">フレーズ</button><button role="tab" data-t="b">伴奏</button><button role="tab" data-t="d">基礎</button><button id="morebtn" data-more="1">その他</button></nav>
  </div>
</div>
<dialog id="set"><b>設定</b>
  <label>画面表示の遅れ補正(ms)。コードの表示が音より早い/遅いときに調整<span class="row"><input type="range" id="off" min="-200" max="200" step="10"><b id="offv"></b></span></label>
  <label>ギターのチューニング<select id="tun"><option value="std">スタンダード</option><option value="dropD">ドロップD</option><option value="halfDown">半音下げ</option></select></label>
  <p style="color:var(--sub);font-size:12px;margin:8px 0">音はすべて端末内で合成しています(ピアノ音源は同梱していません)。Bluetoothイヤホンは遅延が大きくなります。</p>
  <button id="setx">閉じる</button></dialog>

<script src="core/audio.js"></script>
<script src="core/music.js"></script>
<script src="core/engine.js"></script>
<script src="core/tasks.js"></script>
<script src="core/drills.js"></script>
<script src="core/drillrun.js"></script>
<script src="core/store.js"></script>
<script src="core/fretquiz.js"></script>
<script src="core/book.js"></script>
<script src="data/rules.js"></script>
<script src="data/thoughts.js"></script>
<script src="data/guides.js"></script>
<script src="data/tech.js"></script>
<script src="data/tech2.js"></script>
<script src="data/lessons.js"></script>
<script src="core/phrase.js"></script>
<script src="data/licks.js"></script>
<script src="ui/fretboard.js"></script>
<script src="ui/phrase.js"></script>
<script src="ui/keyboard.js"></script>
<script>
(() => {
  const T = ADL, $ = s => document.querySelector(s), KEY = 'adl_set';
  const SOON = {
    b: ['バッキング', 'コードループ・BPM・スウィング・ドラム/ベース自動伴奏(M3で実装)'],
    k: ['教本', 'テクニック用語辞典・かっこよく聞こえる考え方・共通ルール(M5で実装)'],
    r: ['理論', 'スケール辞典・初見スケール攻略カード(M5で実装)'],
    l: ['記録', '練習時間・達成・苦手・バックアップ(M4で実装)']
  };
  let S = { inst: 'guitar', key: 0, scale: 'mpent', sel: 1, mode: 'note', left: false, fade: 0, only: -1 };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  const BKD = { prog: 'minor4', bpm: 100, swing: 0, swMode: '8', count: 1, drum: 'rock8', bass: 'root8', comp: 'whole', shuffle: 0, fadeEvery: 2, vol: { band: 1, phrase: 1, drum: 0.8, bass: 0.9, chord: 0.6 } };
  S.bk = Object.assign({}, BKD, S.bk || {}); S.bk.vol = Object.assign({}, BKD.vol, S.bk.vol);
  const MU = ADLMusic; S.cp = MU.setCustom(S.cp); if (!MU.PROGS[S.bk.prog]) S.bk.prog = 'minor4'; let ct = null; S.view = S.view === 'high' ? 'high' : 'low';
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const last = {};
  const opts = (el, list, v) => { el.innerHTML = list.map(([k, n]) => `<option value="${k}">${n}</option>`).join(''); el.value = v; };
  opts($('#inst'), Object.entries(T.INSTR).map(([k, v]) => [k, v.n]), S.inst);
  opts($('#key'), T.NOTE_S.map((n, i) => [i, T.NOTE_S[i] === T.NOTE_F[i] ? n : n + ' / ' + T.NOTE_F[i]]), S.key);
  if (Array.isArray(S.custom)) T.SCALES.custom = { n: 'カスタム', iv: S.custom, ch: T.analyze(S.custom).extra, tip: '理論タブで作ったスケール。特徴音は青緑で表示。' };
  if (!T.SCALES[S.scale]) S.scale = 'mpent';
  const scaleOpts = () => opts($('#scale'), Object.entries(T.SCALES).map(([k, v]) => [k, v.n]), S.scale);
  scaleOpts();
  $('#left').checked = S.left;

  let positions = [], lapNo = 0, fman = 0;
  const FST = ['全部の音', 'ルートだけ', 'コードトーンだけ', '表示なし'];
  const stage = () => ADLEngine.running ? Math.min(3, Math.floor(lapNo / S.bk.fadeEvery)) : fman;
  function draw() {
    const AS = B.autoSc ? autoInfo() : null, K = AS ? AS.root : S.key, SCI = AS ? AS.scale : S.scale;   // コード別スケール自動提案中は、そのコードのルート・スケールで表示
    const inst = T.INSTR[S.inst], sc = T.SCALES[SCI];
    T.INSTR.guitar.strings = T.INSTR.guitar.tunings[S.tuning] || T.INSTR.guitar.tunings.std;
    const keys = !!inst.keys;
    positions = keys ? [0, 1, 2].map(i => ({ no: i + 1, variants: [{ lo: 0, hi: 0, notes: [] }] })) : T.buildPositions(inst.strings, sc, K, inst.frets);
    if (S.sel > positions.length && !AS) S.sel = 1;
    const sel = S.sel > positions.length ? 1 : S.sel;
    $('#view').parentNode.hidden = keys;
    // 選んだポジションが今の範囲に出てこないときは、範囲を自動で切り替える
    if (!keys && sel && !positions[sel - 1].variants.some(v => T.fitsView(v, T.viewRange(inst, S.view)))) S.view = S.view === 'low' ? 'high' : 'low';
    if (S.only >= inst.strings.length) S.only = -1;
    $('#only').parentNode.hidden = keys; $('#fade').parentNode.hidden = keys;
    if (!keys) opts($('#only'), [[-1, 'すべての弦'], ...inst.strings.map((_, i) => [i, (inst.strings.length - i) + '弦'])], S.only);
    const fst = S.fade ? stage() : 0, vr = keys ? null : T.viewRange(inst, S.view);
    document.querySelectorAll('#fade button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === +S.fade));
    $('#fstage').hidden = !S.fade || keys; $('#fstage').textContent = '足場:' + FST[fst] + (ADLEngine.running ? '' : '(タップで次へ)');
    const cts = ct || MU.chordAt(B.prog, S.key, 0).pcs;
    const tk = typeof task !== 'undefined' && task && task.hl && S.tl !== false ? task : null, lit = tk ? tk.hl : null;   // お題の音を指板に出す(solo=その音だけ、それ以外=ほかを薄く)
    const vis = q => (!tk || !tk.solo || lit.includes(q.d)) && (S.only < 0 || q.s === S.only) && (!S.fade || fst === 0 || (fst === 1 && q.d === 0) || (fst === 2 && cts.includes(T.pc(q.p)))) && !(S.fade && fst === 3);
    const selv = S.only >= 0 || fst >= 3 ? 0 : sel;
    if (!keys) $('#view').innerHTML = ['low', 'high'].map(k => { const r = T.viewRange(inst, k); return `<button data-v="${k}" aria-pressed="${k === S.view}">${r.a}〜${r.b}</button>`; }).join('');
    $('#pos').innerHTML = ['全', ...positions.map(p => p.no)].map((l, i) => `<button data-p="${i}" aria-pressed="${i === sel}">${l}</button>`).join('');
    document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === S.mode));
    if (keys) ADLKeys.render($('#fret'), { scale: SCI, key: K, sel: sel, mode: S.mode, ct, vis, lit }); else ADLFret.render($('#fret'), { inst: S.inst, scale: SCI, key: K, positions, sel: selv, mode: S.mode, left: S.left, view: vr, ct, vis, lit });
    const name = T.noteName(K, K, SCI) + ' ' + sc.n;
    const v = !keys && sel ? (positions[sel - 1].variants.find(x => T.fitsView(x, vr)) || positions[sel - 1].variants[0]) : null;
    $('#tip').innerHTML = `<b>${name}</b>　${keys ? (sel ? `オクターブ${sel}(ポジション${sel})` : '全オクターブ') : sel ? `ポジション${sel}(${v.lo}〜${v.hi}フレット)` : '全ポジション'}<br>${sc.tip}` + (AS ? `<br><b>いまのコード ${AS.chord} → ${AS.name}</b>(${AS.why})` : '');
    if (S.fade && !keys) $('#tip').innerHTML += `<br>足場外し:いまは「${FST[fst]}」`;
    { const fr = $('#fret'), sig = [S.inst, SCI, K, sel, S.view].join(), fm = fr.querySelector('.frame');   // 選択ポジションを画面中央へ
      if (fm && sig !== fr._sig) { const r = fm.getBoundingClientRect(), c = fr.getBoundingClientRect(); fr.scrollLeft += r.left + r.width / 2 - (c.left + c.width / 2); } fr._sig = sig; }
    save();
  }
  $('#only').onchange = e => { S.only = +e.target.value; draw(); };
  $('#fade').onclick = e => { const b = e.target.closest('button'); if (b) { S.fade = +b.dataset.v; fman = 0; draw(); } };
  $('#fstage').onclick = () => { if (!ADLEngine.running) { fman = (fman + 1) % 4; draw(); } };
  $('#inst').onchange = e => { S.inst = e.target.value; draw(); };
  $('#key').onchange = e => { S.key = +e.target.value; draw(); };
  $('#scale').onchange = e => { S.scale = e.target.value; draw(); };
  $('#left').onchange = e => { S.left = e.target.checked; draw(); };
  $('#view').onclick = e => { const b = e.target.closest('button'); if (b) { S.view = b.dataset.v; draw(); } };
  $('#pos').onclick = e => { const b = e.target.closest('button'); if (b) { S.sel = +b.dataset.p; draw(); } };
  $('#mode').onclick = e => { const b = e.target.closest('button'); if (b) { S.mode = b.dataset.m; draw(); } };

  // タップで即発音(pointerdown)。同じ弦の前の音は止める。
  $('#fret').addEventListener('pointerup', e => { if (window.__pinch) return;
    const kk = e.target.closest('.key');
    if (kk) { ADLAudio.play(+kk.dataset.m); return; }
    const h = e.target.closest('.hit'); if (!h) return;
    const s = +h.dataset.s, f = +h.dataset.f, strings = T.INSTR[S.inst].strings;
    ADLAudio.mute([last[s]]); last[s] = ADLAudio.play(strings[s] + f);
    const dot = h.parentNode.querySelector('.hit').ownerSVGElement;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', +h.getAttribute('x') + +h.getAttribute('width') / 2); c.setAttribute('cy', +h.getAttribute('y') + 19); c.setAttribute('class', 'ping');
    dot.appendChild(c); setTimeout(() => c.remove(), 400);
  });
  $('#tabs').onclick = e => {
    const mb = e.target.closest('[data-more]'); if (mb) { $('#more').hidden = !$('#more').hidden; return; }
    const b = e.target.closest('button[data-t]'); if (!b) return;
    document.querySelectorAll('#tabs button[data-t]').forEach(x => x.setAttribute('aria-selected', x === b));
    $('#more').hidden = true; $('#morebtn').setAttribute('aria-selected', !!b.closest('#more')); $('#ttl').textContent = b.textContent === '伴奏' ? 'バッキング' : b.textContent;
    const t = b.dataset.t; document.querySelectorAll('main').forEach(m => { m.hidden = m.id !== 'pg-' + t; });
    if (ADLDrill.running && t !== 'd') ADLDrill.stop();
    if (t === 'd') renderDR();
    if (t === 'f') renderFQ();
    if (t === 'l') renderLog(); if (t === 'k') renderBook();
    if (t === 'r') renderTheory();
    if (t === 'h') ADLPhraseUI.show();
  };
  // ---- 理論 ----
  let TH = { sec: 'card', iv: T.SCALES[S.scale].iv.slice(), q: 'm7' };
  const nn = d => T.noteName(S.key + d, S.key, S.scale) + '(' + T.DEG[d] + ')';
  const presetOf = iv => Object.entries(T.SCALES).find(([k, v]) => k !== 'custom' && v.iv.join() === iv.join());
  function renderTheory() {
    const secs = [['card', '攻略カード'], ['chord', 'コードトーン早見'], ['mode', 'モード対応表']], key = T.noteName(S.key, S.key, S.scale);
    let h = `<div class="seg" id="thsec">${secs.map(([k, n]) => `<button data-s="${k}" aria-pressed="${TH.sec === k}">${n}</button>`).join('')}</div>`;
    if (TH.sec === 'card') {
      const iv = TH.iv, a = T.analyze(iv), p = presetOf(iv), list = x => x.length ? x.map(nn).join('・') : 'なし';
      h += `<div class="cd"><p style="color:var(--sub)">スケールを選ぶか、下の音をタップして自分で作ると、攻略のヒントを自動で作ります。(キー:${key})</p>
        <select id="thpre"><option value="">カスタム</option>${Object.entries(T.SCALES).filter(([k]) => k !== 'custom').map(([k, v]) => `<option value="${k}" ${p && p[0] === k ? 'selected' : ''}>${v.n}</option>`).join('')}</select>
        <div class="tg">${T.DEG.map((d, i) => `<button data-d="${i}" aria-pressed="${iv.includes(i)}">${T.noteName(S.key + i, S.key, S.scale)}<br><small>${d}</small></button>`).join('')}</div>`;
      if (iv.length < 3) h += '<p>3音以上選んでください。</p>';
      else {
        const t3 = a.third == null ? 7 : a.third;
        h += `<h3>${key} ${p ? p[1].n : 'カスタム'}(${a.n}音)</h3><ul>
          <li>構成音:${iv.map(nn).join('・')}</li>
          <li>${a.ref}との違い:追加 ${list(a.extra)} / 抜けている ${list(a.missing)}</li>

    if (ev.stop) { if (keyBefore != null) { S.key = keyBefore; $('#key').value = S.key; keyBefore = null; } curBar = -1; lapNo = 0; ct = null; $('#cur').textContent = '—'; $('#play').textContent = '▶'; chips(); draw(); return; }
    if (ev.bar < 0) { $('#cur').textContent = 'カウント ' + (ev.beat + 1); return; }
    const kc = ev.key != null && ev.key !== S.key; if (kc) { S.key = ev.key; $('#key').value = S.key; }
    const ch = MU.chordAt(B.prog, S.key, ev.bar), lc = ev.lap !== lapNo; lapNo = ev.lap;
    $('#cur').textContent = ch.name + '  ' + (ev.beat + 1);
    if (ev.bar !== curBar || kc || lc) { curBar = ev.bar; ct = ch.pcs; chips(); draw(); }
  }
  let wl = null;
  const wake = async on => { try { if (on) wl = await navigator.wakeLock.request('screen'); else if (wl) { await wl.release(); wl = null; } } catch (e) {} };
  document.addEventListener('visibilitychange', () => { if (document.hidden && ADLEngine.running) ADLEngine.stop(); if (document.hidden) drStop(); });
  $('#gear').onclick = () => { $('#off').value = S.offset || 0; $('#offv').textContent = (S.offset || 0) + 'ms'; $('#tun').value = S.tuning || 'std'; $('#set').showModal(); };
  $('#off').oninput = e => { S.offset = +e.target.value; $('#offv').textContent = S.offset + 'ms'; save(); };
  $('#tun').onchange = e => { S.tuning = e.target.value; draw(); };
  $('#setx').onclick = () => $('#set').close();
  $('#play').onclick = () => { drStop(); if (ADLEngine.running) { ADLEngine.stop(); wake(false); } else { wake(true); curBar = -1; lapNo = 0; seq = [S.key]; keyBefore = S.key; $('#play').textContent = '■'; ADLEngine.start(cfg, onStep); } };
  // 練習タブのバッキング操作(伴奏タブと同じ設定を共有)
  [['prog', 'bprog'], ['drum', 'drum'], ['bass', 'bass'], ['comp', 'comp']].forEach(([k, src]) => { $('#pb-' + k).onchange = e => { B[k] = e.target.value; $('#' + src).value = B[k]; bsync(); save(); }; });
  $('#pb-bpm').oninput = e => { B.bpm = +e.target.value; bsync(); save(); };
  $('#pb-vol').oninput = e => { $('#v-band').value = e.target.value; $('#v-band').dispatchEvent(new Event('input')); };
  $('#pb-asc').onchange = e => { B.autoSc = e.target.checked; $('#asc').checked = B.autoSc; draw(); save(); };
  $('#pb-play').onclick = () => $('#play').click();
  $('#pchips').onclick = e => { const sp = e.target.closest('span[data-i]'); const t = sp && $('#chips').querySelector('span[data-i="' + sp.dataset.i + '"]'); if (t) t.click(); };
  new MutationObserver(() => { $('#pb-play').textContent = $('#play').textContent === '■' ? '■ 停止' : '▶ 再生'; $('#pb-cur').textContent = $('#cur').textContent; }).observe($('#top'), { childList: true, subtree: true, characterData: true });
  // 指板の拡大・縮小(ボタン/ピンチ)。S.zoom=1で幅880px、全体=画面幅に収める
  S.zoom = +S.zoom >= 0.3 && +S.zoom <= 2.5 ? +S.zoom : 1;
  const applyZoom = () => document.documentElement.style.setProperty('--fw', Math.round(880 * S.zoom) + 'px');
  function setZoom(z) {
    z = Math.min(2.5, Math.max(0.3, z)); const el = ['#fret', '#h-fret'].map(q => $(q)).find(e => e && e.offsetParent);
    const r = el && el.scrollWidth ? (el.scrollLeft + el.clientWidth / 2) / el.scrollWidth : 0.5;
    S.zoom = z; applyZoom(); if (el) el.scrollLeft = r * el.scrollWidth - el.clientWidth / 2; save();
  }
  applyZoom();
  document.addEventListener('click', e => { const b = e.target.closest('.zm button'); if (!b) return; setZoom(b.dataset.z === 'in' ? S.zoom * 1.25 : b.dataset.z === 'out' ? S.zoom / 1.25 : 0.3); });
  { let pz = null; const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    document.addEventListener('touchstart', e => { if (e.touches.length === 2 && e.target.closest('#fret,#h-fret')) { pz = { d: dist(e.touches), z: S.zoom }; window.__pinch = true; } }, { passive: true });
    document.addEventListener('touchmove', e => { if (pz && e.touches.length === 2) { e.preventDefault(); setZoom(pz.z * dist(e.touches) / pz.d); } }, { passive: false });
    document.addEventListener('touchend', e => { if (pz && e.touches.length < 2) { pz = null; setTimeout(() => { window.__pinch = false; }, 350); } }); }
  ADLPhraseUI.init({ S, B, MU, draw, bsync, save, autoInfo });
  bsync();
  draw();
  lvBtns(); newTask();
})();
</script>
